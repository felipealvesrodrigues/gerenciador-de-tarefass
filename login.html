<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciador de tarefas</title>
    <link rel="stylesheet" href="CSS/login_page.css">
    <!-- Icons: -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/remixicon/4.6.0/remixicon.css" integrity="sha512-kJlvECunwXftkPwyvHbclArO8wszgBGisiLeuDFwNM8ws+wKIw0sv1os3ClWZOcrEB2eRXULYUsm8OVRGJKwGA==" crossorigin="anonymous" referrerpolicy="no-referrer" /> 
</head>
<body>
    <section class="login">
        <div class="login_content">
            <div>
                <h2 class="login_title">Welcome back 🖐️</h2>

                <form action="" method="post" class="login_form">
                    <div class="login_group">
                        <div class="login_box">
                            <i class="ri-mail-fill" class="login_icon"></i>
                            <input type="email" name="" autocomplete="" required placeholder="" class="login_input" id="">
                            <label for="" class="login_label">Email</label>
                        </div>

                        <div class="login_box">
                            <i class="ri-lock-2-fill" class="login_icon"></i>
                            <input type="password" name="" autocomplete="" required placeholder="" class="login_input" id="">
                            <label for="" class="login_label">Password</label>
                        </div>
                    </div>
                    
                    <a href="#" class="login_forgot">Forgot your password?</a>

                    <button type="submit" class="login_button">
                        Log in <i class="ri-send-plane-2-fill"></i>
                    </button>

                    <p class="login_sign">
                        Don't have an account? <a href="#">Sign Up</a>
                    </p>
                </form>
            </div>
            <div class="login_image">
                <img src="assets/login_image.jpg" alt="login image" class="login_img">
            </div>
        </div>
    </section>
</body>
</html>
